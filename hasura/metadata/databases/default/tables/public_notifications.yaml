table:
  name: notifications
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: step_run
    using:
      foreign_key_constraint_on: step_run_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - workflow_run_id
        - step_run_id
        - channel
        - target
        - subject
        - body
        - status
        - delivery_response
        - sent_at
        - created_at
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
      allow_aggregations: true
event_triggers:
  - name: notify_delivery
    definition:
      enable_manual: true
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: '{{ACTION_BASE_URL}}/events/notify'
    headers:
      - name: x-agentflow-secret
        value_from_env: NHOST_WEBHOOK_SECRET
    comment: >-
      Implements the `notify` step type. The executor inserts a row here and
      moves on; Hasura delivers it out-of-band with its own retry policy, so a
      slow Slack endpoint cannot stall a workflow run.
