table:
  name: workflows
  schema: public
object_relationships:
  - name: org
    using:
      foreign_key_constraint_on: org_id
  - name: creator
    using:
      foreign_key_constraint_on: created_by
array_relationships:
  - name: steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_steps
          schema: public
  - name: triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_triggers
          schema: public
  - name: runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          name: workflow_runs
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - name
        - description
        - is_active
        - created_by
        - created_at
        - updated_at
      # Any member of the owning org can read. Cross-org isolation comes from
      # the traversal to org_members, not from a client-supplied org header.
      filter:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
      allow_aggregations: true
insert_permissions:
  - role: user
    permission:
      columns:
        - org_id
        - name
        - description
        - is_active
      # owner|editor may create, and only inside an org they belong to.
      check:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _in:
                - owner
                - editor
      set:
        created_by: X-Hasura-User-Id
    comment: owner/editor only; created_by is server-set, not client-supplied.
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - description
        - is_active
      filter:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _in:
                - owner
                - editor
      # `check` repeats the filter so a row cannot be updated into a state the
      # caller would not have been allowed to create.
      check:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _in:
                - owner
                - editor
delete_permissions:
  - role: user
    permission:
      filter:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _in:
                - owner
                - editor
