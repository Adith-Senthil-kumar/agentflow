version: 3
# Endpoint and admin secret are supplied per-invocation by scripts/hasura-apply.sh
# from your local .env.local, so nothing environment-specific is committed here.
# The placeholder below is only what `hasura console` falls back to.
endpoint: http://localhost:8080
metadata_directory: metadata
migrations_directory: migrations
actions:
  kind: synchronous
  handler_webhook_baseurl: http://localhost:3000
